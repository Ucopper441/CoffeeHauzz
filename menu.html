  <script>
    class MenuItem {

    }
    class MenuCatalog {
      #items;
      constructor(items) { this.#items = items; }
      all() { return [...this.#items]; }
      byCategory(category) { return category === 'all' ? this.all() : this.#items.filter(item => item.category === category); }
      categories() { return ['all', 'coffee', 'matcha', 'chocolate', 'tea', 'non-coffee', /* 'snacks', */ 'delight', 'bread', 'mommy-fries']; }
    }

      init() { const requestedCategory = new URLSearchParams(window.location.search).get('category'); if (this.#catalog.categories().includes(requestedCategory)) this.#activeCategory = requestedCategory; this.renderTabs(); this.renderContent(); this.tabs.addEventListener('click', event => { const button = event.target.closest('[data-category]'); if (!button) return; this.#activeCategory = button.dataset.category; this.renderTabs(); this.renderContent(); }); }
      categoryLabel(category) { return ({ all:'All', coffee:'Coffee', matcha:'Matcha', chocolate:'Chocolate', tea:'Tea', 'non-coffee':'Non-Coffee', snacks:'Snacks', delight:'Delight', bread:'Bread', 'mommy-fries':'Mommy Fries' })[category]; }
      sectionTitle(category) { return ['delight', 'bread'].includes(category) ? `${this.categoryLabel(category)} Menu` : `${this.categoryLabel(category)} Line Up`; }
      formatPrice(price) { return price === null ? '—' : `RM ${price}`; }

      renderMommyFries(items) {
        const groups = ['Signature Loaded Fries', 'Nachos', 'Fries & Snacks', 'Burger'];
        const sections = groups.map(group => {
          const cards = items.filter(item => item.group === group).map(item => `<article class="mommy-card">${item.image ? `<img src="assets/${item.image}" alt="${item.name}" loading="lazy" width="110" height="110">` : ''}<div class="mommy-card-body"><h4 class="mommy-card-title">${item.name}</h4><p class="mommy-card-description">${item.description}</p><p class="mommy-card-price">${this.formatPrice(item.price)}</p></div></article>`).join('');
          return `<h3 class="mommy-group">${group}</h3><div class="mommy-grid">${cards}</div>`;
        }).join('');
        return `<section class="mommy-menu" aria-labelledby="mommy-menu-heading"><p class="mommy-menu-kicker">Street food with a premium touch</p><h2 id="mommy-menu-heading" class="mommy-menu-heading">Mommy <span>Fries</span></h2><p class="mommy-menu-tagline">Loaded fries, nachos, snacks and more.</p><p class="mommy-menu-hours">Open weekends &amp; public holidays · 4 PM – 12 PM</p>${sections}</section>`;
      }
      renderSection(category, items) { if (category === 'mommy-fries') return this.renderMommyFries(items); const singlePrice = ['snacks','delight','bread'].includes(category); const heading = singlePrice ? '<div class="price-head w-24 text-center text-[11px] font-black uppercase tracking-widest text-charcoal">Price</div>' : '<div class="price-head grid w-40 grid-cols-2 gap-1 text-center text-[11px] font-black uppercase tracking-widest text-charcoal"><span>Hot</span><span>Ice</span></div>'; const rows = items.map(item => singlePrice ? `<tr><td class="item">${item.name}${item.description ? `<p class="item-description">${item.description}</p>` : ''}</td><td class="price">${this.formatPrice(item.price)}</td></tr>` : `<tr><td class="item">${item.name}</td><td class="price ${item.priceHot === null ? 'text-neutral-400' : ''}">${this.formatPrice(item.priceHot)}</td><td class="price ${item.priceIce === null ? 'text-neutral-400' : ''}">${this.formatPrice(item.priceIce)}</td></tr>`).join(''); return `<section class="mb-9"><div class="section-heading mb-2 flex items-end justify-between gap-2 border-b-2 border-charcoal pb-2"><h2 class="text-xl font-black uppercase tracking-tight">${this.sectionTitle(category)}</h2>${heading}</div><table class="menu-table" aria-label="${this.categoryLabel(category)} menu"><tbody>${rows}</tbody></table></section>`; }
      renderContent() { const categories = this.#activeCategory === 'all' ? this.#catalog.categories().slice(1) : [this.#activeCategory]; this.content.innerHTML = categories.map(category => this.renderSection(category, this.#catalog.byCategory(category))).join(''); }
    }
