<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" /><meta name="description" content="Coffee Hauz's complete menu in Seri Kembangan." /><title>Menu — Coffee Hauz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{mortar:'#f4f4f2',charcoal:'#121212',tungsten:'#f59e0b'}}}}</script>
  <style>body{margin:0;background:#f4f4f2;color:#121212;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.grain{background-image:radial-gradient(rgba(18,18,18,.075) .6px,transparent .7px);background-size:5px 5px}.menu-panel{background:#f4f4f2}.menu-table{width:100%;border-collapse:collapse}.menu-table td{padding:7px 0;font-size:14px;line-height:1.1}.menu-table .price{width:78px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}.menu-table .item{padding-right:12px}.menu-table tbody tr:hover{background:#e8e8e4}.menu-tab[aria-selected="true"]{background:#121212;color:#f4f4f2}@media(max-width:767px){.menu-table td{font-size:13px}.menu-table .price{width:64px}.menu-table td{padding:7px 0}}</style>
</head>
<body class="grain">
  <header class="border-b border-neutral-800 bg-charcoal text-mortar"><div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8"><a href="index.html" class="flex items-center gap-3" aria-label="Coffee Hauz home"><span class="grid h-9 w-9 place-items-center border border-tungsten text-lg text-tungsten">CH</span><span class="text-sm font-black uppercase tracking-[.2em]">Coffee<br>Hauz</span></a><nav class="flex items-center gap-1 text-[10px] font-black uppercase tracking-[.14em]" aria-label="Primary navigation"><a href="index.html" class="px-3 py-3 text-neutral-400 hover:text-tungsten">Home</a><a href="menu.html" class="border-b-2 border-tungsten px-3 py-3 text-mortar" aria-current="page">Menu</a></nav><a href="https://www.google.com/maps/search/?api=1&query=12%2C%20Jalan%20PP%2014%2C%20Taman%20Pinggiran%20Putra%2C%20Seri%20Kembangan" target="_blank" rel="noopener noreferrer" class="border border-neutral-600 px-3 py-2 text-xs font-bold uppercase tracking-widest hover:border-tungsten hover:text-tungsten">Directions ↗</a></div></header>
  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8"><section class="overflow-hidden border border-neutral-300"><div class="menu-panel p-5 sm:p-8 md:p-10"><div class="mb-6 flex items-end justify-between border-b-2 border-charcoal pb-4"><div><p class="text-[10px] font-black uppercase tracking-[.2em] text-neutral-500">Coffee Hauz / Seri Kembangan</p><h1 class="mt-2 text-4xl font-black uppercase leading-none tracking-[-.07em]">Menu</h1></div><p class="text-right text-[10px] font-bold uppercase tracking-widest text-neutral-500">All prices<br>in MYR</p></div><div id="menuTabs" class="mb-8 grid grid-cols-2 border border-neutral-400 sm:grid-cols-5" role="tablist" aria-label="Menu categories"></div><div id="menuContent" aria-live="polite"></div><p class="mt-6 border-t border-neutral-400 pt-4 text-[10px] font-bold uppercase tracking-widest text-neutral-500">Walk in · order at counter · subject to availability</p></div></section></main>
  <script>
    class MenuItem {
      constructor({ id, name, category, priceIce, priceHot, isSeasonal = false }) { Object.assign(this, { id, name, category, priceIce, priceHot, isSeasonal }); }
    }
    class MenuCatalog {
      #items;
      constructor(items) { this.#items = items; }
      all() { return [...this.#items]; }
      byCategory(category) { return category === 'all' ? this.all() : this.#items.filter(item => item.category === category); }
      categories() { return ['all', 'coffee', 'tea-chocolate', 'non-coffee', 'bites']; }
    }
    class MenuUI {
      #catalog; #activeCategory = 'all';
      constructor(catalog) { this.#catalog = catalog; this.tabs = document.querySelector('#menuTabs'); this.content = document.querySelector('#menuContent'); }
      init() { this.renderTabs(); this.renderContent(); this.tabs.addEventListener('click', event => { const button = event.target.closest('[data-category]'); if (!button) return; this.#activeCategory = button.dataset.category; this.renderTabs(); this.renderContent(); }); }
      categoryLabel(category) { return ({ all:'All', coffee:'Coffee', 'tea-chocolate':'Matcha & Tea', 'non-coffee':'Non-Coffee', bites:'Bites' })[category]; }
      formatPrice(price) { return price === null ? '—' : `RM ${price}`; }
      renderTabs() { this.tabs.innerHTML = this.#catalog.categories().map(category => `<button type="button" class="menu-tab min-h-11 border-b border-r border-neutral-400 px-2 text-[10px] font-black uppercase tracking-[.08em] last:border-r-0 sm:border-b-0" data-category="${category}" role="tab" aria-selected="${category === this.#activeCategory}">${this.categoryLabel(category)}</button>`).join(''); }
      renderSection(category, items) { return `<section class="mb-8"><div class="mb-2 flex items-end justify-between border-b border-neutral-400 pb-2"><h2 class="text-xl font-black uppercase">${this.categoryLabel(category)}</h2><div class="grid w-40 grid-cols-2 gap-1 text-center text-[11px] font-black uppercase tracking-widest"><span>Ice</span><span>Hot</span></div></div><table class="menu-table" aria-label="${this.categoryLabel(category)} menu"><tbody>${items.map(item => `<tr><td class="item ${item.isSeasonal ? 'font-bold' : ''}">${item.name}${item.isSeasonal ? ' <span class="ml-1 text-[9px] uppercase tracking-widest text-neutral-500">Seasonal</span>' : ''}</td><td class="price ${item.priceIce === null ? 'text-neutral-400' : ''}">${this.formatPrice(item.priceIce)}</td><td class="price ${item.priceHot === null ? 'text-neutral-400' : ''}">${this.formatPrice(item.priceHot)}</td></tr>`).join('')}</tbody></table></section>`; }
      renderContent() { const categories = this.#activeCategory === 'all' ? this.#catalog.categories().slice(1) : [this.#activeCategory]; this.content.innerHTML = categories.map(category => this.renderSection(category, this.#catalog.byCategory(category))).join(''); }
    }
    const menuItems = [
      new MenuItem({id:'americano',name:'Americano',category:'coffee',priceIce:6,priceHot:5}),new MenuItem({id:'doppio',name:'Doppio',category:'coffee',priceIce:8,priceHot:7}),new MenuItem({id:'tonic-espresso',name:'Tonic Espresso',category:'coffee',priceIce:8,priceHot:null}),new MenuItem({id:'latte',name:'Latte',category:'coffee',priceIce:7,priceHot:6}),new MenuItem({id:'latte-gula-aren',name:'Latte Gula Aren',category:'coffee',priceIce:8,priceHot:7}),new MenuItem({id:'vanilla-latte',name:'Vanilla Latte',category:'coffee',priceIce:8,priceHot:7}),new MenuItem({id:'spanish-latte',name:'Spanish Latte',category:'coffee',priceIce:8,priceHot:7}),new MenuItem({id:'macchiato',name:'Macchiato',category:'coffee',priceIce:9,priceHot:8}),new MenuItem({id:'mocha',name:'Mocha',category:'coffee',priceIce:9,priceHot:8}),new MenuItem({id:'mocha-toffee-nut-latte',name:'Mocha Toffee Nut Latte',category:'coffee',priceIce:12,priceHot:11}),new MenuItem({id:'cappuccino',name:'Cappuccino',category:'coffee',priceIce:8,priceHot:7}),new MenuItem({id:'caramel-latte',name:'Caramel Latte',category:'coffee',priceIce:8,priceHot:7}),new MenuItem({id:'caramel-butter-latte',name:'Caramel Butter Latte',category:'coffee',priceIce:10,priceHot:9}),new MenuItem({id:'caramel-macchiato',name:'Caramel Macchiato',category:'coffee',priceIce:10,priceHot:9}),new MenuItem({id:'salted-caramel-latte',name:'Salted Caramel Latte',category:'coffee',priceIce:12,priceHot:11}),new MenuItem({id:'hazelnut-latte',name:'Hazelnut Latte',category:'coffee',priceIce:10,priceHot:9}),new MenuItem({id:'toffee-nut-latte',name:'Toffee Nut Latte',category:'coffee',priceIce:10,priceHot:9}),new MenuItem({id:'avocado-coffee',name:'Avocado Coffee',category:'coffee',priceIce:12,priceHot:null}),
      new MenuItem({id:'matcha-latte',name:'Matcha Latte',category:'tea-chocolate',priceIce:8,priceHot:7}),new MenuItem({id:'matcha-green-tea',name:'Matcha Green Tea',category:'tea-chocolate',priceIce:10,priceHot:9}),new MenuItem({id:'matcha-strawberry',name:'Matcha Strawberry',category:'tea-chocolate',priceIce:12,priceHot:11}),new MenuItem({id:'chocolate',name:'Chocolate',category:'tea-chocolate',priceIce:7,priceHot:6}),new MenuItem({id:'classic-chocolate',name:'Classic Chocolate',category:'tea-chocolate',priceIce:9,priceHot:8}),new MenuItem({id:'double-chocolate',name:'Double Chocolate',category:'tea-chocolate',priceIce:12,priceHot:11}),new MenuItem({id:'red-tea',name:'Red Tea',category:'tea-chocolate',priceIce:6,priceHot:5}),new MenuItem({id:'green-tea',name:'Green Tea',category:'tea-chocolate',priceIce:6,priceHot:5}),new MenuItem({id:'lemon-tea',name:'Lemon Tea',category:'tea-chocolate',priceIce:5,priceHot:4}),new MenuItem({id:'honey-lemon-tea',name:'Honey Lemon Tea',category:'tea-chocolate',priceIce:6,priceHot:5}),new MenuItem({id:'strawberry-tea',name:'Strawberry Tea',category:'tea-chocolate',priceIce:8,priceHot:7}),
      new MenuItem({id:'butterfly-pea-fizz',name:'Butterfly Pea Fizz',category:'non-coffee',priceIce:6,priceHot:null}),new MenuItem({id:'strawberry-fizz',name:'Strawberry Fizz',category:'non-coffee',priceIce:7,priceHot:null}),new MenuItem({id:'mix-berries-fizz',name:'Mix Berries Fizz',category:'non-coffee',priceIce:7,priceHot:null}),new MenuItem({id:'kiwi-fizz',name:'Kiwi Fizz',category:'non-coffee',priceIce:7,priceHot:null}),new MenuItem({id:'strawberry-milk-base',name:'Strawberry Milk Base',category:'non-coffee',priceIce:8,priceHot:null}),new MenuItem({id:'mix-berries-milk-base',name:'Mix Berries Milk Base',category:'non-coffee',priceIce:8,priceHot:null}),new MenuItem({id:'kiwi-milk-base',name:'Kiwi Milk Base',category:'non-coffee',priceIce:8,priceHot:null}),new MenuItem({id:'yakult-fizz',name:'Yakult Fizz',category:'non-coffee',priceIce:8,priceHot:null}),new MenuItem({id:'solano',name:'Solano',category:'non-coffee',priceIce:5,priceHot:null}),
      new MenuItem({id:'cheezy-loaded-fries',name:'Cheezy Loaded Fries',category:'bites',priceIce:null,priceHot:10}),new MenuItem({id:'classic-french-fries',name:'Classic French Fries',category:'bites',priceIce:null,priceHot:6})
    ];
    new MenuUI(new MenuCatalog(menuItems)).init();
  </script>
</body>
</html>
