<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <meta name="description" content="Coffee Hauz menu — coffee, matcha, tea and bites in Seri Kembangan." />
  <title>Menu — Coffee Hauz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{mortar:'#f4f4f2',charcoal:'#121212',structural:'#737373',tungsten:'#f59e0b'},fontFamily:{mono:['ui-monospace','SFMono-Regular','Menlo','monospace']}}}}</script>
  <style>
    body{margin:0;background:#f4f4f2;color:#121212;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.grain{background-image:radial-gradient(rgba(18,18,18,.075) .6px,transparent .7px);background-size:5px 5px}.menu-row{transition:background .16s ease,color .16s ease}.menu-row:hover{background:#121212;color:#f4f4f2}.menu-row:hover .desc,.menu-row:hover .label{color:#b8b8b1}.menu-row:hover .price{color:#f59e0b}
  </style>
</head>
<body class="grain antialiased">
  <main class="mx-auto min-h-screen max-w-3xl border-x border-neutral-300 bg-mortar">
    <header class="border-b border-neutral-800 bg-charcoal px-5 py-5 text-mortar sm:px-7">
      <div class="flex items-center justify-between gap-4"><a href="index.html" class="flex items-center gap-3" aria-label="Coffee Hauz home"><span class="grid h-9 w-9 place-items-center border border-tungsten text-sm font-black text-tungsten">CH</span><span class="text-xs font-black uppercase tracking-[.18em]">Coffee<br>Hauz</span></a><a href="https://www.google.com/maps/search/?api=1&query=12%2C%20Jalan%20PP%2014%2C%20Taman%20Pinggiran%20Putra%2C%20Seri%20Kembangan" target="_blank" rel="noopener noreferrer" class="border border-neutral-600 px-3 py-2 text-[10px] font-black uppercase tracking-widest hover:border-tungsten hover:text-tungsten">Directions ↗</a></div>
      <div class="mt-8 border-l-2 border-tungsten pl-3"><p class="text-[10px] font-bold uppercase tracking-[.2em] text-tungsten">Walk in · Counter service</p><h1 class="mt-2 text-4xl font-black uppercase leading-none tracking-[-.08em]">Menu<br>board</h1><p class="mt-3 text-xs leading-5 text-neutral-300">Open from 4 PM till late · all prices in MYR</p></div>
    </header>
    <nav id="tabs" class="sticky top-0 z-10 grid grid-cols-3 border-b border-neutral-800 bg-mortar" role="tablist" aria-label="Menu categories"></nav>
    <section class="px-5 pb-3 pt-5 sm:px-7"><div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-[.17em] text-structural"><span id="itemCount">0 items</span><span>Ice / Hot where listed</span></div></section>
    <section id="list" class="border-t border-neutral-300" aria-live="polite"></section>
    <footer class="border-t border-neutral-800 bg-tungsten px-5 py-5 text-[10px] font-black uppercase tracking-[.13em] text-charcoal sm:px-7"><div class="flex flex-wrap justify-between gap-3"><span>Order at counter</span><a href="tel:+12025551234" class="underline underline-offset-4">Call +1 (202) 555-1234</a></div></footer>
  </main>
  <script>
    class MenuItem { constructor(id,name,category,ice,hot,description){Object.assign(this,{id,name,category,ice,hot,description})} get prices(){return [[this.ice,'Ice'],[this.hot,'Hot']].filter(([price])=>price!==null)} }
    class MenuCatalog { #items; constructor(items){this.#items=items} categories(){return ['Coffee','Matcha & Tea','Bites']} byCategory(category){return this.#items.filter(item=>item.category===category)} }
    class MenuUI { #catalog; #category='Coffee'; constructor(catalog){this.#catalog=catalog;this.tabs=document.querySelector('#tabs');this.list=document.querySelector('#list');this.count=document.querySelector('#itemCount')} init(){this.renderTabs();this.renderList();this.tabs.addEventListener('click',event=>{const button=event.target.closest('[data-category]');if(!button)return;this.#category=button.dataset.category;this.renderTabs();this.renderList()})} money(price){return `RM ${price}`} renderTabs(){this.tabs.innerHTML=this.#catalog.categories().map(category=>`<button type="button" role="tab" data-category="${category}" aria-selected="${category===this.#category}" class="min-h-14 border-r border-neutral-300 px-2 text-[10px] font-black uppercase tracking-[.08em] last:border-r-0 ${category===this.#category?'bg-charcoal text-mortar':'hover:bg-neutral-200'}">${category==='Matcha & Tea'?'Matcha / Tea':category}</button>`).join('')} renderList(){const items=this.#catalog.byCategory(this.#category);this.count.textContent=`${items.length} items`;this.list.innerHTML=items.map(item=>`<article class="menu-row px-5 py-5 sm:px-7"><h2 class="text-xl font-black uppercase leading-tight tracking-[-.055em]">${item.name}</h2><div class="mt-3 flex flex-wrap gap-x-5 gap-y-2">${item.prices.map(([price,label])=>`<p class="price text-lg font-black tracking-[-.04em]"><span class="label mr-1 text-[10px] tracking-[.12em] text-structural">${label.toUpperCase()}</span>${this.money(price)}</p>`).join('')}</div><p class="desc mt-3 text-xs leading-5 text-structural">${item.description}</p></article>`).join('')} }
    const catalog=new MenuCatalog([
      new MenuItem('americano','Americano','Coffee',6,5,'Espresso cut with water. Straight, clean, no fuss.'),new MenuItem('latte','Latte','Coffee',7,6,'Espresso and milk, built for a long outdoor sit.'),new MenuItem('gula','Latte Gula Aren','Coffee',8,7,'Espresso, milk, and deep palm sugar.'),new MenuItem('spanish','Spanish Latte','Coffee',8,7,'Condensed milk sweetness with a coffee edge.'),new MenuItem('butter','Caramel Butter Latte','Coffee',10,9,'Buttery caramel through espresso and milk.'),new MenuItem('mocha','Mocha','Coffee',9,8,'Chocolate, espresso, milk. Familiar for good reason.'),new MenuItem('toffee','Mocha Toffee Nut Latte','Coffee',12,11,'Chocolate coffee with a toasted nut finish.'),
      new MenuItem('matcha','Matcha Latte','Matcha & Tea',8,7,'Green tea, milk, and a little calm before night.'),new MenuItem('dirty','Matcha Espresso / Dirty Matcha','Matcha & Tea',10,9,'Matcha and espresso on the same shift.'),new MenuItem('strawberry','Matcha Strawberry','Matcha & Tea',12,11,'Matcha milk with strawberry sweetness.'),new MenuItem('lemon','Lemon Tea','Matcha & Tea',5,4,'A sharp, simple reset between conversations.'),new MenuItem('honey','Honey Lemon Tea','Matcha & Tea',6,5,'Tea, honey, lemon. Easy in either temperature.'),new MenuItem('pistachio','Iced Pistachio Latte','Matcha & Tea',12,null,'Seasonal: espresso, creamy pistachio, cold milk.'),
      new MenuItem('loaded','Cheezy Loaded Fries','Bites',10,null,'Hot fries, cheese sauce, and enough crunch.'),new MenuItem('fries','Salted French Fries','Bites',6,null,'Salt, potato, a paper tray. That is the brief.')
    ]);new MenuUI(catalog).init();
  </script>
</body>
</html>
